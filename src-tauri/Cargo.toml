[package]
name = "ourfault"
version = "0.1.0"
description = "OurFault - investigation reports from operations-log rows"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "ourfault_lib"
path = "src/lib.rs"

[[bin]]
name = "ourfault"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Desktop shell and IPC. No optional features (tray, protocol-asset, ...) are enabled.
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local date/time for investigation dates and timestamps.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# URL parsing for validation only - the application never fetches URLs.
url = "2"
thiserror = "2"
# PDF export (src/render/pdf): glyph lookup and metrics of the bundled font,
# right-to-left reordering of mixed Hebrew/Latin lines, and stream compression.
# Small, dependency-free crates instead of a browser or typesetting engine.
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data", "std"] }
miniz_oxide = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
